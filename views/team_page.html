{{ template "layout" . }}

{{ define "content" }}
<div class="w-full flex justify-center">
	<div class="w-1/3 xs:w-1/2 space-y-6">
		<div class="rounded bg-white/5 p-5">
			<h3 class="text-sm italic">Team</h3>
			<h1 class="text-4xl font-bold">{{ .team.TeamName }}</h1>
		</div>
		<div class="rounded bg-white/5 p-5">
			<h3 class="text-sm italic">Description</h3>
			<p>{{ .team.TeamDesc }}</p>
		</div>
	</div>
</div>
{{ end }}
