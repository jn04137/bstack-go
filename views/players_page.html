{{ template "layout" . }}

{{ define "content" }}
<div class="flex justify-center w-full">
	<div class="xs:w-3/4 md:w-1/3 space-y-4">
		<h1 class="text-4xl font-bold">Players</h1>
		{{ range .players }}
			{{ template "player_card" . }}
		{{ end }}
	</div>
</div>
{{ end }}

{{ define "player_card" }}
<div class="bg-white/5 p-5 rounded">
		<h3 class="italic text-xs">Player</h3>
		<a href="/user/player_page/{{ .NanoId }}">
			<h2 class="text-2xl pb-3 font-bold">{{ .Username }}</h2>
		</a>
		<h3 class="italic text-xs">Description</h3>
		<p class="text-sm">{{ .Details }}</p>
</div>
{{ end }}
